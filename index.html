<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Labs — Ширинга А. О.</title>
<meta name="description" content="Лабораторні роботи з тестування програмного забезпечення. Ширинга А. О., ІП-44.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232f5bd3'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #eef2f8;
    --card: #ffffff;
    --text: #1d2433;
    --muted: #5d677a;
    --accent: #2f5bd3;
    --accent-text: #ffffff;
    --border: #d9e0ec;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11151d;
      --card: #1a202b;
      --text: #e6eaf2;
      --muted: #9aa5b8;
      --accent: #6d8ff0;
      --accent-text: #0d1220;
      --border: #2c3443;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px 16px;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 32px 28px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(20, 40, 90, .08);
  }
  h1 { margin: 0 0 4px; font-size: 28px; }
  .who { margin: 0 0 24px; color: var(--muted); }
  .labs { display: grid; gap: 12px; }
  .labs a {
    display: block;
    padding: 12px 16px;
    border-radius: 10px;
    background: var(--accent);
    color: var(--accent-text);
    font-weight: 600;
    text-decoration: none;
    transition: transform .15s, filter .15s;
  }
  .labs a:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .labs a:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  footer { color: var(--muted); font-size: 14px; text-align: center; }
</style>
</head>
<body>
  <main class="card">
    <h1>QA Labs</h1>
    <p class="who">Ширинга А. О., група ІП-44</p>
    <nav class="labs" aria-label="Лабораторні роботи">
      <a href="ui-controls.html">Лабораторна 2: UI-елементи</a>
    </nav>
  </main>
  <footer>© 2026 Ширинга А. О.</footer>
</body>
</html>
